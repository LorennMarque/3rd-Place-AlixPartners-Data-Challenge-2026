<style>
  .product-row {
    cursor: pointer;
  }

  .product-row:hover {
    background: #1a1d1f;
  }

  .product-row.is-active {
    background: rgba(85, 173, 60, 0.14);
  }

  #product-drawer-backdrop {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  #product-drawer-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  #product-drawer {
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }

  #product-drawer.is-open {
    transform: translateX(0);
  }

  .pallet-viz-scene {
    position: relative;
    height: 280px;
    overflow: hidden;
    background: linear-gradient(180deg, #1a1d1f 0%, #131617 100%);
    border: 1px solid #1f2326;
  }

  #pallet-viz-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .drawer-metric {
    border: 1px solid #1f2326;
    background: #1a1d1f;
    padding: 0.75rem;
  }
</style>

<div id="product-drawer-backdrop" class="fixed inset-0 z-40 hidden bg-black/20"></div>
<aside
  id="product-drawer"
  class="fixed right-0 top-0 z-50 flex h-full w-full max-w-md flex-col border-l border-surface-border bg-surface shadow-xl"
  aria-hidden="true"
>
  <div class="flex items-start justify-between gap-4 border-b border-surface-border px-5 py-4">
    <div>
      <p class="text-xs uppercase tracking-wide text-neutral-400">Producto</p>
      <h2 id="drawer-product-code" class="mt-1 text-xl font-medium text-neutral-900">-</h2>
      <p id="drawer-product-box" class="mt-1 text-sm text-neutral-500">-</p>
    </div>
    <button
      type="button"
      id="close-product-drawer"
      class="text-neutral-500 hover:text-neutral-900"
      aria-label="Cerrar detalle"
    >
      ×
    </button>
  </div>

  <div class="flex-1 overflow-y-auto px-5 py-5">
    <p id="drawer-empty-message" class="hidden mb-4 border border-neutral-200 bg-neutral-50 px-3 py-2 text-sm text-neutral-600">
      Cargá o seleccioná una solución para ver el detalle de packaging.
    </p>

    <div id="drawer-packaging-content">
      <div class="grid grid-cols-2 gap-3">
        <div class="drawer-metric">
          <p class="text-xs text-neutral-500">Ocupacion caja</p>
          <p id="drawer-ocupacion-caja" class="mt-1 text-lg font-medium tabular-nums">-</p>
        </div>
        <div class="drawer-metric">
          <p class="text-xs text-neutral-500">Util. pallet teorica</p>
          <p id="drawer-util-pallet" class="mt-1 text-lg font-medium tabular-nums">-</p>
        </div>
        <div class="drawer-metric">
          <p class="text-xs text-neutral-500">Cajas por pallet</p>
          <p id="drawer-cajas-pallet" class="mt-1 text-lg font-medium tabular-nums">-</p>
        </div>
        <div class="drawer-metric">
          <p class="text-xs text-neutral-500">Apilado</p>
          <p id="drawer-apilado" class="mt-1 text-sm font-medium tabular-nums">-</p>
        </div>
        <div class="drawer-metric col-span-2">
          <p class="text-xs text-neutral-500">Dimensiones producto (L × A × H)</p>
          <p id="drawer-product-dims" class="mt-1 text-sm font-medium tabular-nums">-</p>
        </div>
        <div class="drawer-metric col-span-2">
          <p class="text-xs text-neutral-500">Dimensiones caja exterior (L × A × H)</p>
          <p id="drawer-box-dims" class="mt-1 text-sm font-medium tabular-nums">-</p>
        </div>
      </div>

      <div class="mt-6">
        <div class="mb-3 flex items-center justify-between gap-3">
          <h3 class="text-sm font-medium text-neutral-900">Ocupacion del pallet</h3>
          <p id="drawer-pallet-caption" class="text-xs text-neutral-500">1200 × 800 × 1800 mm</p>
        </div>
        <div id="pallet-viz" class="pallet-viz-scene">
          <canvas id="pallet-viz-canvas" aria-label="Visualizacion de ocupacion del pallet"></canvas>
        </div>
        <p id="drawer-pallet-legend" class="mt-2 text-xs text-neutral-500"></p>
      </div>
    </div>
  </div>
</aside>
